<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate customizable QR codes in your browser. Add a logo, pick colors and styles, and download as SVG or PNG. Nothing leaves your device." />
    <title>Damero — QR code generator</title>
    <script>
      (() => {
        let stored = null
        try {
          stored = localStorage.getItem('damero:theme')
        } catch {
          stored = null
        }
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
